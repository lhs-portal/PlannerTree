<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<meta name="description" content="Lesson Tree Planner — build a complete 35-minute lesson plan from your curriculum database and export it to Google Sheets.">
<base target="_top">
<title>Lesson Tree Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div id="auth" class="auth-screen">
  <div class="auth-glow" aria-hidden="true"></div>
  <form id="authForm" class="term" autocomplete="on" novalidate hidden>
    <div id="termLog" class="term-log" role="log" aria-live="polite"></div>
    <div id="termLine" class="term-line">
      <span id="termPrompt" class="term-prompt">email:</span>
      <span class="term-text"><span id="termBefore"></span><span id="termCursor" class="term-cursor"></span><span id="termAfter"></span></span>
      <input id="authEmail" class="term-in" type="text" name="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="email">
      <input id="authPass" class="term-in" type="password" name="password" autocomplete="current-password" aria-label="password" tabindex="-1">
    </div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div id="hud">
    <span id="stage"><span id="stage-num">Step 1</span> <span id="stage-text">Strand Selection</span></span>
    <span id="dots"></span>
  </div>

  <button id="gear" aria-label="Planner settings" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
      <circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
    </svg>
  </button>

  <div id="panel">
    <h3>Planner Configuration</h3>
    <label>Subject / Scheme
      <select id="scheme"></select>
    </label>
    <label>Week Number
      <input id="week" placeholder="e.g. 14">
    </label>
    <label>Grade / Class
      <input id="grade" placeholder="e.g. 10">
    </label>
    <label>Lessons Count
      <input id="lessons" type="number" min="1" max="20" placeholder="Auto (1 tab per outcome)">
    </label>
    <div class="row">
      <button id="reload">Reload Data</button>
      <button id="reset">Start Over</button>
    </div>
    <div class="row panel-session">
      <button id="umSignout" type="button" class="danger">Sign out</button>
    </div>
  </div>

  <div id="toast" role="alert"></div>
  <div id="demoBanner" hidden>Preview mode — sample data only.</div>

  <div id="wrap">
    <div id="canvas">
      <svg id="svg" aria-hidden="true"></svg>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
