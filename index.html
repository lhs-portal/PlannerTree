<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<meta name="description" content="Lesson Tree Planner — build a complete 35-minute lesson plan from your curriculum database and export it to Google Sheets.">
<base target="_top">
<title>Lesson Tree Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div id="auth" class="auth-screen">
  <div class="auth-glow" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M16 28V6"/><path d="M16 12l7-5"/><path d="M16 18l-7-5"/><path d="M16 24l7-5"/>
          <circle cx="16" cy="4" r="2.4"/><circle cx="24" cy="6" r="2.2"/><circle cx="8" cy="12" r="2.2"/><circle cx="24" cy="18" r="2.2"/>
        </svg>
      </span>
      <div>
        <h1>Lesson Tree Planner</h1>
        <p>Hithadhoo School · weekly lesson design</p>
      </div>
    </div>

    <form id="authForm" novalidate>
      <label class="field">Email
        <input id="authEmail" type="email" autocomplete="username" inputmode="email" placeholder="you@school.edu.mv" required>
      </label>
      <label class="field">Password
        <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <div class="auth-meta">
        <label class="chk"><input id="authRemember" type="checkbox" checked> Keep me signed in</label>
      </div>

      <button id="authSubmit" type="submit" class="btn-primary">Sign in</button>
      <p id="authMsg" class="auth-msg" role="status" aria-live="polite"></p>
    </form>

    <div class="auth-actions">
      <button type="button" id="authDemo" class="btn-ghost">Preview offline demo</button>
      <button type="button" id="authInstall" class="btn-ghost" hidden>Install app</button>
    </div>
    <p class="auth-foot"><span id="authMode">Connecting…</span> · accounts live in your Google Sheet</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div id="hud">
    <span id="stage"><span id="stage-num">Step 1</span> <span id="stage-text">Strand Selection</span></span>
    <span id="dots"></span>
  </div>

  <div id="userbox">
    <button id="userBtn" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
      <span id="avatar">·</span>
      <span id="userName">Account</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="userMenu" hidden>
      <div class="um-head"><b id="umName">—</b><small id="umEmail"></small></div>
      <button id="umInstall" type="button" hidden>⤓ Install app</button>
      <button id="umSignout" type="button" class="danger">Sign out</button>
    </div>
  </div>

  <button id="gear" aria-label="Planner settings" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
      <circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
    </svg>
  </button>

  <div id="panel">
    <h3>Planner Configuration</h3>
    <label>Subject / Scheme
      <select id="scheme"></select>
    </label>
    <label>Week Number
      <input id="week" placeholder="e.g. 14">
    </label>
    <label>Grade / Class
      <input id="grade" placeholder="e.g. 10">
    </label>
    <label>Lessons Count
      <input id="lessons" type="number" min="1" max="20" placeholder="Auto (1 tab per outcome)">
    </label>
    <label>Master Template File ID
      <input id="tpl" spellcheck="false">
    </label>
    <label>Google Drive Output Folder ID
      <input id="folder" spellcheck="false">
    </label>
    <div class="row">
      <button id="reload">Reload Data</button>
      <button id="reset">Start Over</button>
    </div>
    <button id="redesign-tpl-btn" class="panel-accent">🎨 Redesign Master Template in Drive</button>
  </div>

  <div id="toast" role="alert"></div>
  <div id="demoBanner" hidden>Preview mode — sample data only.</div>

  <div id="wrap">
    <div id="canvas">
      <svg id="svg" aria-hidden="true"></svg>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
